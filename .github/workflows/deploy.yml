# 每天早上 7 點（台灣時間）自動抓最新物價、重新建置網站，並發布到 Cloudflare Pages。
# 推送程式碼到 main 時也會發布一次；在 GitHub 的 Actions 頁面也可以手動按 "Run workflow"。
#
# 需要在 GitHub 專案的 Settings → Secrets and variables → Actions 加入兩個密鑰：
#   CLOUDFLARE_API_TOKEN   Cloudflare 的 API Token（權限：Cloudflare Pages - Edit）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 的帳戶 ID
name: 更新物價並發布網站

on:
  schedule:
    - cron: '0 23 * * *' # UTC 23:00 = 台灣 07:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_NAME: life-board # Cloudflare Pages 專案名稱，網址會是 life-board.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 抓物價資料
        run: npm run fetch-prices

      - name: 建置網站
        run: npm run build

      - name: 發布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 第一次執行時建立專案；已經存在就略過
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch=main
